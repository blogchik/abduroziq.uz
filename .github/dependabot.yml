version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: dev
    # Wait before proposing a new release (version updates only; security updates are never
    # delayed). Longer than pnpm's minimumReleaseAge (one day), so every proposal can install.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check and typescript-eslint do not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node must track the Node major in .nvmrc (24), not the latest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Astro pins its own Vite major; a different one breaks the build.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      # onlyBuiltDependencies was replaced by allowBuilds in pnpm 11; stay on 10.
      - dependency-name: pnpm
        update-types: [version-update:semver-major]

  # `/` covers .github/workflows only; the shared setup step is a local composite action.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    target-branch: dev
    cooldown:
      default-days: 3
    groups:
      actions:
        update-types: [minor, patch]
