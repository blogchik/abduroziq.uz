name: CI

# One pipeline for every branch: check -> (Lighthouse and the end-to-end suite, side by side)
# -> deploy -> a check of the live site, the last two only on `main`. The deploy publishes the
# `dist` that the other jobs tested; nothing is built again after the tests (docs/DEPLOY.md).
on:
  push:
    branches: [dev, main]
    # Files the site is not built from. A change to these alone runs nothing: no check and, on
    # `main`, no deploy. `*.md` is the repository root only; posts are `.mdx` anyway.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/assets/**'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/assets/**'
      - '.github/dependabot.yml'
  # A manual run on `main` checks and deploys that commit again; on another branch it only checks.
  workflow_dispatch:

# On `dev` and in pull requests a newer push cancels the older run. On `main` nothing is
# cancelled, so a deploy never stops halfway: runs wait for each other, and while one runs only
# the newest waiting push is kept.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # One cache family per month. Each run restores the newest entry and saves it again with
      # what it added, so without a reset the cache would only grow; a new month starts empty.
      - name: Name this month's Turborepo cache
        id: turbo
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore local Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ steps.turbo.outputs.month }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ steps.turbo.outputs.month }}-

      # Format check first (a clear Prettier message when a file is not formatted), then media
      # metadata, lint, typecheck, unit checks and the production-mode build (indexing
      # allowed): the `dist` that Lighthouse, the end-to-end suite and the deploy use.
      - run: pnpm check

      # The commit of this build, served at /version.txt, so that the check after the deploy can
      # tell that the live site serves this build and not an older one.
      - name: Stamp the build with its commit
        run: echo "$GITHUB_SHA" > apps/web/dist/version.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun --config=./lighthouserc.json

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end smoke suite
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist

      # The suite runs headless without a `channel` (playwright.config.ts), so the Chromium
      # headless shell is all it needs. Not cached: Playwright's CI guide says restoring the
      # browser takes about as long as downloading it, and the system libraries are installed
      # either way.
      - name: Install the Chromium headless shell and its system libraries
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run the end-to-end suite
        run: pnpm test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [check, lighthouse, e2e]
    # Production is `main` only. The `production` environment accepts `main` only as well
    # (Settings -> Environments), so a run on another branch could not read its secrets even if
    # this line changed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://abduroziq.uz
    steps:
      # wrangler.jsonc and the lockfile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only for the wrangler version locked in pnpm-lock.yaml. Nothing is built in this job,
      # so no build code ever runs next to the Cloudflare token.
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Deployed"
            echo
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "- Site: https://abduroziq.uz"
            if [ -n "$DEPLOY_URL" ]; then
              echo "- Wrangler: $DEPLOY_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Check the live site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # /version.txt names this commit, the pages answer 200, a missing page 404, and www and
      # http redirect to https://abduroziq.uz.
      - run: bash .github/scripts/check-live-site.sh "$GITHUB_SHA"

  # A commit that reaches `main` without `dev` (a save in the content panel) is brought into
  # `dev` here, so work on `dev` starts from it. Only a fast-forward: when `dev` has commits of
  # its own, it is left alone and the run says so (merge `main` into `dev` by hand then).
  # Independent of the checks, so that `dev` gets the commit even when it fails and the fix can
  # be made on `dev` as usual. A move made with the workflow token starts no new run.
  sync-dev:
    name: Fast-forward dev to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Move dev to this commit if dev is behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/dev...$GITHUB_SHA" --jq .status)"
          case "$status" in
            identical)
              echo "dev is already at ${GITHUB_SHA::7}."
              ;;
            ahead)
              # force=false: GitHub refuses anything but a fast-forward.
              if gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/dev" \
                -f sha="$GITHUB_SHA" -F force=false > /dev/null; then
                echo "dev fast-forwarded to ${GITHUB_SHA::7}."
              else
                echo "::warning title=dev not moved::GitHub refused to move dev to ${GITHUB_SHA::7} (a commit that changes a workflow cannot be pushed with the workflow token). Run: git fetch origin && git merge origin/main"
              fi
              ;;
            *)
              echo "::notice title=dev not moved::dev has commits that main does not ($status). Bring main in by hand: git fetch origin && git merge origin/main"
              ;;
          esac

  # One Telegram message per run on `main` saying whether this commit was published, so that a
  # save in the content panel does not need a visit to the Actions tab (docs/DEPLOY.md,
  # "Telegram notification"). It never fails the run. The commit message is text that whoever
  # pushed wrote, so it reaches the script through an environment variable, never pasted into
  # it.
  notify:
    name: Notify on Telegram
    needs: [check, lighthouse, e2e, deploy, verify]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The bot token and chat id live in the `production` environment; `deployment: false` reads
    # them without recording another deployment.
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Send the result
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_RESULT: ${{ needs.check.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Every job before the deploy that failed, by name. A job after a failed one is
          # skipped, not failed.
          failed=""
          if [ "$CHECK_RESULT" = "failure" ]; then failed="$failed, pnpm check"; fi
          if [ "$LIGHTHOUSE_RESULT" = "failure" ]; then failed="$failed, Lighthouse assertions"; fi
          if [ "$E2E_RESULT" = "failure" ]; then failed="$failed, end-to-end suite"; fi
          if [ "$DEPLOY_RESULT" = "failure" ]; then failed="$failed, deploy to Cloudflare"; fi
          failed="${failed#, }"

          if [ "$DEPLOY_RESULT" = "success" ] && [ "$VERIFY_RESULT" = "failure" ]; then
            headline="⚠️ Published, but the live site check failed"
            detail="Open https://abduroziq.uz; to roll back see docs/DEPLOY.md"
          elif [ "$DEPLOY_RESULT" = "success" ]; then
            headline="✅ Published"
            detail="https://abduroziq.uz"
          elif [ -n "$failed" ]; then
            headline="❌ Not published"
            detail="Failed: $failed"
          elif [ "$CHECK_RESULT" = "cancelled" ] || [ "$LIGHTHOUSE_RESULT" = "cancelled" ] \
            || [ "$E2E_RESULT" = "cancelled" ] || [ "$DEPLOY_RESULT" = "cancelled" ]; then
            headline="⚠️ Not published"
            detail="The run was cancelled"
          else
            headline="❌ Not published"
            detail="See the run"
          fi

          # First line of the commit message (empty for a manual run), then the short SHA.
          commit="${GITHUB_SHA::7}"
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          if [ -n "$subject" ]; then
            commit="$subject ($commit)"
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          bash .github/scripts/telegram.sh \
            "$(printf '%s\n%s\n%s\n%s' "$headline" "$commit" "$detail" "$run_url")"
